name = "agent-tollgate-engine"
main = "packages/api-worker/src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
MERCHANT_PAYOUT_ADDRESS_SOL = "DSvMhichkVACpR89fmuN2m1UZry8AgNb1QXFZetmDmT1"
MERCHANT_PAYOUT_ADDRESS_EVM = "0x64f0117D37DDf366405747D7f9520851907fd077"
PLATFORM_FEE_BPS = "30"
EVM_MIN_CONFIRMATIONS = "3"
PAYMENT_MAX_AGE_SEC = "900"
X402_FACILITATOR_URL = "https://x402.dexter.cash,https://facilitator.payai.network"
LIFI_INTEGRATOR = "agent-tollgate"
JITO_TIP_LAMPORTS = "100000"
CF_ACCOUNT_ID = "c61e27ee2c91de3d62296679174be03d"
EGRESS_URL = "https://agent-tollgate-engine.marculini1312.workers.dev/internal/egress"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "NONCE_STORE"
class_name = "NonceStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceStore"]

[[d1_databases]]
binding = "SALES"
database_name = "tollgate-sales"
database_id = "0423d9bc-9bd5-4f22-ad3b-cb6ac9a1acd0"

[[kv_namespaces]]
binding = "CACHE"
id = "cc15b1fefd7646c18651dd19c1e4702e"

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "tollgate_events"
